<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1b18" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #1d1b18; color: #f2ede3; }
      html[data-theme="light"], html[data-theme="light"] body { background: #efe9db; color: #201d18; }
      #root { min-height: 100vh; }
      .boot-shell { min-height: 100vh; display: grid; place-content: center; gap: 10px; text-align: center; font-family: "Space Grotesk", system-ui, sans-serif; }
      .boot-wordmark { font-size: 14px; font-weight: 600; letter-spacing: 0.22em; }
      .boot-line { font-size: 12px; opacity: 0.65; }
    </style>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("cutroom-theme") === "light" ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#efe9db" : "#1d1b18");
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <meta
      name="description"
      content="CUTROOM is a cinematic storyboard and visual narrative studio: compose frames, set the rhythm, preview the cut, and export presentation-ready boards."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CUTROOM" />
    <meta property="og:title" content="CUTROOM: storyboard and visual narrative studio" />
    <meta
      property="og:description"
      content="Compose frames, set the rhythm, preview the cut, and export presentation-ready storyboards. Client-only, no account, free."
    />
    <meta property="og:url" content="https://cutroom-green.vercel.app/" />
    <meta property="og:image" content="https://cutroom-green.vercel.app/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CUTROOM: storyboard and visual narrative studio" />
    <meta
      name="twitter:description"
      content="Compose frames, set the rhythm, preview the cut, and export presentation-ready storyboards."
    />
    <meta name="twitter:image" content="https://cutroom-green.vercel.app/social-preview.png" />
    <title>CUTROOM: storyboard and visual narrative studio</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" role="status" aria-live="polite">
        <div class="boot-wordmark">CUTROOM</div>
        <div class="boot-line">Preparing the cutting room</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
